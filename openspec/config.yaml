schema: spec-driven

context: |
  Tech stack: Next.js 16.2.6, React 19.2.4, Tailwind CSS v4, TypeScript
  Architecture: Clean/Hexagonal Architecture (domain, application, infrastructure, components, app layers)
  Testing: Custom parser test (npm run test:parser)
  Style: ESLint (npm run lint), TypeScript type checking (npx tsc --noEmit)

strict_tdd: true

testing:
  strict_tdd: true
  detected: 2026-06-09
  test_runner:
    command: "npm run test:parser"
    framework: "Custom TSX Parser Test"
  test_layers:
    unit:
      available: false
      tool: "-"
    integration:
      available: false
      tool: "-"
    e2e:
      available: false
      tool: "-"
  coverage:
    available: false
    command: "-"
  quality_tools:
    linter:
      available: true
      command: "npm run lint"
    type_checker:
      available: true
      command: "npx tsc --noEmit"
    formatter:
      available: false
      command: "-"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
